<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OOP Classes Runner</title></head>
<body>
<script>
  const files = {
    "student-registration-validation": "student_registration_validation.js",
    "form-builder": "form_builder_class.js",
    "movie-ticket-booking": "movie_ticket_booking.js",
    "login-form-dom": "login_form_dom.js",
    "user-object-editor": "user_object_editor.js",
  };
  const key = new URLSearchParams(location.search).get("exercise");
  if (!key) {
    document.body.innerHTML = "<h3>Pick an exercise</h3>" +
      Object.keys(files).map(k => `<p><a href="run.html?exercise=${k}">${k.replace(/-/g, " ")}</a></p>`).join("");
  } else {
    const s = document.createElement("script");
    s.src = files[key];
    document.body.appendChild(s);
  }
</script>
</body>
</html>

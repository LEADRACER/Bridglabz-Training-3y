<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width-device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="">
    <label for="name">Name:</label>
    <input type="text" name="" id="name">
    <br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email">
    <br>
    <label for="name">Password:</label>
    <input type="password" name="password" id="password">
    <br>
    <p>Gender:</p>
    <input type="select" value="male" id="male">
    <label for="">Male</label>

    <input type="select" value="female" id="female">
    <label for="">Female</label>

    <p>Skills:</p>
    <input type="checkbox" value="java" id="java">
    <label for="">Java</label>

    <input type="checkbox" value="javascript" id="javscript">
    <label for="">JavaScript</label>

    <input type="checkbox" value="python" id="python">
    <label for="">Python</label>

    <button type="submit">Submit</button>
  </form>
</body>
</html>

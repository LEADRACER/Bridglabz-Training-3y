<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>
</head>

<body bgcolor="lightblue">
    <form>
        <fieldset>
            <legend>Student Registration Form</legend>
            <h2>Personal Details</h2>
            <label for="ID">Enter ID:</label>
            <input type="text" name="ID" id="ID">
            <br />
            <br />
            <label for="pass">Enter Password:</label>
            <input type="password" name="pass" id="pass">
            <br />
            <br />
            <label for="datepicker">Choose Date</label>
            <input type="date" name="datepicker" id="datepicker">
            <br />
            <p>Gender:</p>
            <label for="radio1">Male</label>
            <input type="radio" id="radio1" name="radio1">
            <label for="radio2">Female</label>
            <input type="radio" id="radio2" name="radio1">
            <label for="radio3">Other</label>
            <input type="radio" id="radio3" name="radio1">
            <br />
            <p>Language:</p>
            <label for="checkbox1">English</label>
            <input type="checkbox" name="checkbox1" id="checkbox1">
            <label for="checkbox2">Hindi</label>
            <input type="checkbox" name="checkbox2" id="checkbox2">
            <label for="checkbox3">Spanish</label>
            <input type="checkbox" name="checkbox3" id="checkbox3">
            <br />
            <br />
            <label for="file">Upload file</label>
            <input type="file" id="file" name="file">
            <br/>
            <br/>
            <label for="selector1">Choose Your Dish:</label>
            <select name="dishes" id="selector1">
                <option value="maggie">Maggie</option>
                <option value="pasta">Pasta</option>
                <option value="chips">Chips</option>
                <option value="namkeen">Namkeen</option>
            </select>
            <br />
            <br />
            <label for="textarea1">Enter Message:</label>
            <br />
            <textarea name="textarea1" id="textarea1" rows="5" cols="30"></textarea>
            <br/>
            <br/>
            <input type="image" name="images" id="names" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5kTgOcGg3sWOhFQEhB2Kb6mZEJiUAx_4rhtkxhM2NanSllz009MWIVS8&s=10" height="50px" width="50px">
            <br/>
            <br/>
            <input type="submit">
            <input type="reset">
        </fieldset>
    </form>
</body>

</html>
